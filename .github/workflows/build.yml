# SPDX-License-Identifier: MIT
name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up the pi32v2 LLVM toolchain (checks the release's SHA256SUMS)
        id: toolchain
        uses: jvitkauskas/pi32v2-isa/.github/actions/setup-pi32v2@66ac37bb2ae40e5dbbd5588a6a7c2d7baf829d7f
        with:
          version: pi32v2-23.1.5-5
      - name: Point the build at the toolchain
        shell: bash
        run: echo "TOOLCHAIN=${{ steps.toolchain.outputs.path }}" >> "$GITHUB_ENV"
      - name: Install the Upkr packer, at a fixed commit
        shell: bash
        run: |
          cargo install --locked --git https://github.com/exoticorn/upkr --rev a9e56d9d50d1f64cab7590f2c584a12b173e7715 --root "$RUNNER_TEMP/upkr" upkr
          echo "UPKR=$RUNNER_TEMP/upkr/bin/upkr" >> "$GITHUB_ENV"
      - name: Build with entry, flash and RAM checks
        run: make -j2
      - name: Public tests (private fixtures are absent)
        run: make test
      - name: Address and undefined-behavior sanitizers
        shell: bash
        run: |
          if make sanitize 2>&1 | tee "$RUNNER_TEMP/sanitize.log"; then
            exit 0
          fi
          if grep -Eq 'LeakSanitizer.*(fatal error|does not work|not supported)' "$RUNNER_TEMP/sanitize.log"; then
            echo 'LeakSanitizer cannot run here; retrying with leak detection only disabled.'
            ASAN_OPTIONS=detect_leaks=0 make sanitize
          else
            exit 1
          fi
      - name: Reproducibility
        run: make reproducible
      - name: Upload release artifacts and manifest only
        uses: actions/upload-artifact@v4
        with:
          name: m-bootloader-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/fm1/uboot.boot
            build/smk37/uboot.boot
            build/fm1/uboot.fwsc
            build/smk37/uboot-pro.fwsc
            build/smk37/uboot-elite.fwsc
            build/fm1/stage-ram.bin
            build/smk37/stage-ram.bin
            build/fm1/stage.fwsc
            build/smk37/stage-pro.fwsc
            build/smk37/stage-elite.fwsc
            build/fm1/stage-listed.fwsc
            build/smk37/stage-pro-listed.fwsc
            build/smk37/stage-elite-listed.fwsc
            build/loader/mflr-loader-a.bin
            build/loader/mflr-loader-b.bin
            build/manifest.json

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m-bootloader-${{ github.sha }}
          path: artifacts
      - name: Prepare distinct board filenames and checksums
        shell: bash
        run: |
          mkdir release
          cp artifacts/fm1/uboot.boot release/fm1-uboot.boot
          cp artifacts/smk37/uboot.boot release/smk37-uboot.boot
          cp artifacts/fm1/uboot.fwsc release/fm1-uboot.fwsc
          cp artifacts/smk37/uboot-pro.fwsc release/smk37-pro-uboot.fwsc
          cp artifacts/smk37/uboot-elite.fwsc release/smk37-elite-uboot.fwsc
          cp artifacts/fm1/stage-ram.bin release/fm1-stage-ram.bin
          cp artifacts/smk37/stage-ram.bin release/smk37-stage-ram.bin
          cp artifacts/fm1/stage.fwsc release/fm1-stage.fwsc
          cp artifacts/smk37/stage-pro.fwsc release/smk37-pro-stage.fwsc
          cp artifacts/smk37/stage-elite.fwsc release/smk37-elite-stage.fwsc
          cp artifacts/fm1/stage-listed.fwsc release/fm1-stage-listed.fwsc
          cp artifacts/smk37/stage-pro-listed.fwsc release/smk37-pro-stage-listed.fwsc
          cp artifacts/smk37/stage-elite-listed.fwsc release/smk37-elite-stage-listed.fwsc
          cp artifacts/loader/mflr-loader-a.bin release/mflr-loader-a.bin
          cp artifacts/loader/mflr-loader-b.bin release/mflr-loader-b.bin
          cd release
          sha256sum fm1-uboot.boot smk37-uboot.boot fm1-uboot.fwsc smk37-pro-uboot.fwsc smk37-elite-uboot.fwsc \
            fm1-stage-ram.bin smk37-stage-ram.bin fm1-stage.fwsc smk37-pro-stage.fwsc smk37-elite-stage.fwsc \
            fm1-stage-listed.fwsc smk37-pro-stage-listed.fwsc smk37-elite-stage-listed.fwsc \
            mflr-loader-a.bin mflr-loader-b.bin > SHA256SUMS
      - name: Publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" --clobber \
              release/fm1-uboot.boot release/smk37-uboot.boot \
              release/fm1-uboot.fwsc release/smk37-pro-uboot.fwsc release/smk37-elite-uboot.fwsc \
              release/fm1-stage-ram.bin release/smk37-stage-ram.bin release/fm1-stage.fwsc release/smk37-pro-stage.fwsc release/smk37-elite-stage.fwsc \
              release/fm1-stage-listed.fwsc release/smk37-pro-stage-listed.fwsc release/smk37-elite-stage-listed.fwsc \
              release/mflr-loader-a.bin release/mflr-loader-b.bin release/SHA256SUMS
          else
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
              --title "m-bootloader $RELEASE_TAG" \
              release/fm1-uboot.boot release/smk37-uboot.boot \
              release/fm1-uboot.fwsc release/smk37-pro-uboot.fwsc release/smk37-elite-uboot.fwsc \
              release/fm1-stage-ram.bin release/smk37-stage-ram.bin release/fm1-stage.fwsc release/smk37-pro-stage.fwsc release/smk37-elite-stage.fwsc \
              release/fm1-stage-listed.fwsc release/smk37-pro-stage-listed.fwsc release/smk37-elite-stage-listed.fwsc \
              release/mflr-loader-a.bin release/mflr-loader-b.bin release/SHA256SUMS
          fi
